<style>
  /* =========================================================
     RIGHTAWARE — SIGN UP / GET STARTED PAGE
     Hero logo card styling
     ========================================================= */

  .path-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1rem;
    margin:1.2rem 0;
  }

  .path-card{
    text-align:left;
    cursor:pointer;
    border:1px solid var(--border);
    background:#fff;
    border-radius:14px;
    padding:1.1rem;
    box-shadow:var(--shadow);
    transition:.15s;
  }

  .path-card:hover,
  .path-card:focus-visible{
    border-color:var(--green);
    transform:translateY(-2px);
  }

  .path-card[aria-pressed="true"]{
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(34,197,94,.25);
  }

  .path-card h3{
    margin:.4rem 0 .3rem;
  }

  .path-card p{
    margin:0;
    font-size:.86rem;
    color:var(--muted);
  }

  .path-card .icon{
    font-size:1.6rem;
  }

  .field-note{
    font-size:.78rem;
    color:var(--muted);
    margin-top:-.3rem;
  }

  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:.4rem;
  }

  .chips label{
    border:1px solid var(--border);
    border-radius:999px;
    padding:.3rem .7rem;
    font-size:.82rem;
    cursor:pointer;
    background:#f8fafc;
  }

  .chips input{
    margin-right:.35rem;
  }

  .chips label:has(input:checked){
    border-color:var(--green);
    background:#ecfdf5;
  }

  fieldset{
    border:1px solid var(--border);
    border-radius:12px;
    padding:.9rem 1rem;
    margin:1rem 0;
  }

  legend{
    font-weight:700;
    font-size:.85rem;
    padding:0 .4rem;
  }

  #backBtn{
    margin-bottom:.8rem;
  }

  .status-pill{
    display:inline-block;
    padding:.2rem .6rem;
    border-radius:999px;
    font-size:.75rem;
    font-weight:800;
  }


  /* =========================================================
     GET STARTED HERO — RIGHTAWARE LOGO
     This changes ONLY the large logo card on signup.html.
     It does NOT affect the footer logo.
     ========================================================= */

  .page-hero-media{
    margin:0;
    background:#ffffff;
    border-radius:20px;
    padding:2.5rem;
    min-height:320px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:0 18px 50px rgba(0,0,0,.18);
    overflow:hidden;
  }

  .page-hero-media img{
    display:block;
    width:100%;
    max-width:360px;
    height:auto;

    border-radius:0;
    box-shadow:none;
    object-fit:contain;
  }


  /* Mobile */
  @media(max-width:900px){

    .path-grid{
      grid-template-columns:1fr;
    }

    .page-hero-media{
      min-height:240px;
      padding:2rem;
      border-radius:18px;
    }

    .page-hero-media img{
      max-width:280px;
    }
  }

  @media(max-width:520px){

    .page-hero-media{
      min-height:210px;
      padding:1.5rem;
    }

    .page-hero-media img{
      max-width:240px;
    }
  }
</style>
