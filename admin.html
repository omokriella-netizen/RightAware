<script>
(function(){
  "use strict";
  var body = document.getElementById("adminBody"),
      line = document.getElementById("adminLine"),
      title = document.getElementById("adminTitle");

  var ENTITIES = [
    ["Rights guides","rights.html","RA_RIGHTS_DETAIL"],["Legal documents","laws.html","RA_LAWS"],
    ["Videos","videos.html","RA_VIDEOS_LIB"],["Organization types","organizations.html","RA_ORG_TYPES"],
    ["Verified organizations","organizations.html","RA_ORGANIZATIONS"],["Professionals","lawyers.html","RA_PROFESSIONALS"],
    ["FAQs","resources.html#faqs","RA_FAQS"]
  ];
  function count(key){ try{ var v = eval("(" + key + ")"); return Array.isArray(v) ? v.length : "—"; }catch(_){ return "—"; } }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]; }); }
  function whenReady(cb){
    if(window.RA_SUPA && RA_SUPA.ready){ cb(true); return; }
    var done = false;
    function once(v){ if(done) return; done = true; cb(v); }
    document.addEventListener("ra:backend-ready", function(){ once(true); }, { once:true });
    setTimeout(function(){ once(false); }, 6000);
  }

  /* ==================== LOCKED: demo / no backend ==================== */
  function renderLocked(){
    title.innerHTML = 'Content management <span class="pill">LOCKED — NO BACKEND</span>';
    line.innerHTML = 'Signed in as <strong>' + esc((RA_AUTH.current()||{}).email || "guest")
      + '</strong> — role: <strong>none</strong>. This device has no database connection, so the dashboard stays locked. Applications and messages below are copies stored only in this browser.';
    var local = [];
    try{ local = JSON.parse(localStorage.getItem("ra_applications") || "[]"); }catch(_){}
    body.innerHTML =
      '<div class="notice rv">🔒 <strong>Locked.</strong> Admin access requires a signed-in account whose role is <code>admin</code> in the database (row-level security enforces this server-side — hiding buttons is not enough). '
      + '<button class="btn btn-secondary btn-sm" id="prevBtn">Preview dashboard layout (read-only)</button></div>'
      + '<div id="prev"></div>'
      + '<div class="section-head" style="margin-top:1.5rem"><span class="eyebrow">Applications</span><h2>Registration applications on this device</h2></div>'
      + (local.length
          ? local.map(function(a){
              return '<div class="app-item"><strong>' + (a.path==="professional" ? "⚖️ Professional" : "🏛 Organisation") + '</strong> — ' + esc(a.name)
                + ' &lt;' + esc(a.email) + '&gt;<div class="app-meta">Ref ' + esc(a.ref) + ' · ' + esc(a.status) + ' · ' + esc(String(a.at).slice(0,19).replace("T"," ")) + '</div>'
                + '<div class="empty">Not submitted anywhere (backend never connected). Re-submit from signup when the site is live.</div></div>';
            }).join("")
          : '<p class="empty">No applications have been made from this browser.</p>');
    document.getElementById("prevBtn").addEventListener("click", function(){
      document.getElementById("prev").innerHTML =
        '<div class="section-head" style="margin-top:1.5rem"><h2>Dashboard preview (read-only)</h2><p>Each card maps to a Supabase table + admin API.</p></div>'
        + '<div class="cards-grid">' + ENTITIES.map(function(e){
            return '<article class="card rv"><h3>' + e[0] + '</h3><p><strong>' + count("window." + e[2]) + '</strong> records in local catalog</p>'
              + '<a class="link" href="' + e[1] + '">Open public page →</a><br/><button class="btn btn-outline btn-sm" disabled title="Requires admin role + backend">Manage (locked)</button></article>';
          }).join("") + '</div>'
        + '<div class="two-col"><div class="card rv"><h3>🚩 Review moderation queue (this device)</h3><p>' + RA_REVIEWS.queue().length + ' flagged item(s).</p></div>'
        + '<div class="card rv"><h3>✉️ Contact messages (this device)</h3><p>' + RA_DB.messages().length + ' stored message(s).</p></div></div>'
        + '<div class="notice" style="margin-top:1rem">Role model: <strong>admin</strong> (all), <strong>editor</strong> (content), <strong>moderator</strong> (reviews), <strong>user</strong> (own data). Enforced by Supabase RLS — never by frontend code.</div>';
    });
  }

  /* ==================== SIGNED OUT: backend on, no session ==================== */
  function renderSignedOut(){
    title.textContent = "Sign in required";
    line.innerHTML = 'You are not signed in. The administrator dashboard opens only for accounts that carry the <strong>admin</strong> role in the database.';
    body.innerHTML = '<div class="notice rv">🔐 Sign in with an administrator account to review registration applications, contact messages and content. '
      + 'Roles live in the database (see <code>docs/DATABASE.md</code>) — row-level security enforces access server-side; hiding buttons is never how access is decided.</div>'
      + '<p><a class="btn btn-primary" href="login.html?next=admin.html">Sign in</a> <a class="btn btn-secondary" href="index.html">Home</a></p>';
  }

  /* ==================== DENIED: backend on, role not admin ==================== */
  function renderDenied(role){
    title.textContent = "Access denied";
    line.innerHTML = 'Signed in as <strong>' + esc((RA_AUTH.current()||{}).email || "?") + '</strong> — role: <strong>' + esc(role || "user") + '</strong>. Only administrators can open this dashboard.';
    body.innerHTML = '<div class="notice rv">🚫 Your account does not have the <code>admin</code> role. The database would refuse every query here anyway (row-level security). '
      + 'If you believe this is wrong, an existing administrator must grant the role — see <code>docs/DATABASE.md</code>.</div>'
      + '<p><a class="btn btn-primary" href="account.html">Back to my account</a> <a class="btn btn-secondary" href="index.html">Home</a></p>';
  }

  /* ==================== UNLOCKED: admin dashboard ==================== */
  function renderAdmin(user){
    title.innerHTML = 'Admin dashboard <span class="pill">ADMIN</span>';
    line.innerHTML = 'Signed in as <strong>' + esc(user.email || "admin") + '</strong> — role: <strong>admin</strong>. '
      + 'Everything below is read live from the database; row-level security blocks anyone else.';
    body.innerHTML =
      '<div class="admin-tabs" role="tablist" aria-label="Admin sections">'
      + '<button role="tab" id="tabApps" aria-selected="true" aria-controls="panelApps">📋 Applications</button>'
      + '<button role="tab" id="tabContent" aria-selected="false" aria-controls="panelContent">📚 Content overview</button>'
      + '<button role="tab" id="tabMsgs" aria-selected="false" aria-controls="panelMsgs">✉️ Contact messages</button>'
      + '</div>'
      + '<div id="panelApps" role="tabpanel" aria-labelledby="tabApps">'
        + '<div class="section-head"><span class="eyebrow">Registration applications</span><h2>Awaiting your decision</h2>'
        + '<p>Workflow: submitted → pending → verified (publish) or rejected (private). Nothing is public while pending; rejected rows stay private too.</p>'
        + '<p class="app-meta" id="raBuild">build: admin-20261001-3 · every card, status and control below renders live from the database.</p></div>'
        + '<div id="appsBox"><p class="empty">Loading applications…</p></div>'
        + '<div class="notice" style="margin-top:.6rem">💡 Approval writes to the database with your admin session — the server re-checks your role. <strong>Mark reviewed</strong> on a message marks only that message read; Approve / Reject act on the application records. A message copy is never the application record: each copy states whether its record exists, and when the record is missing (the applicant has not signed in yet) the copy offers <strong>Create application record</strong> from the applicant\'s own submitted data. If a professional list is unexpectedly empty, apply <code>supabase/applications-access.sql</code> once (additive policies only; it does not re-run the schema).</div>'
      + '</div>'
      + '<div id="panelContent" role="tabpanel" aria-labelledby="tabContent" hidden>'
        + '<div class="section-head"><span class="eyebrow">Content</span><h2>Catalogues</h2></div>'
        + '<div class="cards-grid">' + ENTITIES.map(function(e){
            return '<article class="card"><h3>' + e[0] + '</h3><p><strong>' + count("window." + e[2]) + '</strong> records in local catalog</p><a class="link" href="' + e[1] + '">Open public page →</a></article>';
          }).join("") + '</div>'
        + '<div class="notice" style="margin-top:1rem">Editing content happens through the database (RLS <code>editor</code>/<code>admin</code> policies). The in-page content editor remains an architecture preview until it is wired to those APIs.</div>'
      + '</div>'
      + '<div id="panelMsgs" role="tabpanel" aria-labelledby="tabMsgs" hidden>'
        + '<div class="section-head"><span class="eyebrow">Inbox</span><h2>Contact messages</h2></div>'
        + '<div id="msgsBox"><p class="empty">Loading…</p></div>'
      + '</div>';

    var tabs = [["tabApps","panelApps"],["tabContent","panelContent"],["tabMsgs","panelMsgs"]];
    tabs.forEach(function(t){
      document.getElementById(t[0]).addEventListener("click", function(){
        tabs.forEach(function(x){
          var on = x[0] === t[0];
          document.getElementById(x[0]).setAttribute("aria-selected", on ? "true" : "false");
          document.getElementById(x[1]).hidden = !on;
        });
        if(t[0] === "tabMsgs") loadMessages();
      });
    });
    loadApplications();
  }

  /* ---------- application list ----------
     appCtx carries per-render context into the item builders: applicant
     e-mails matched from the application MESSAGE COPIES (the professionals
     table stores no e-mail column and profiles are not admin-readable via
     RLS) and specialisations read from professional_specializations. */
  var appCtx = { emailFor: function(){ return ""; }, specByPro: {}, copyInfo: {} };
  /* Status pill shows the value the DATABASE actually holds — never a
     hardcoded label — so an unexpected/NULL status is flagged, not hidden. */
  function statusPill(st){
    var s = String(st || "").toLowerCase();
    if(s === "verified") return '<span class="pill-green">VERIFIED</span>';
    if(s === "rejected") return '<span class="pill-red">REJECTED</span>';
    if(s === "pending") return '<span class="pill">PENDING</span>';
    if(s === "unverified") return '<span class="pill">UNVERIFIED</span>';
    return '<span class="pill-red">STATUS ' + esc(st || "unset") + '</span>';
  }
  /* text[] arrives as a JSON array; tolerate a plain string or null instead of
     letting .join() throw and silently kill a whole section. */
  function arr(v, sep){
    if(Array.isArray(v)) return v.join(sep || ", ");
    return (v == null || v === "") ? "" : String(v);
  }
  /* One broken record must never take down its section: render it as a
     visible error card instead of vanishing into a swallowed exception. */
  function safe(fn, row, what){
    try{ return fn(row); }
    catch(err){ return '<div class="app-item">⚠ Could not render this ' + esc(what) + ' record (' + esc(err && err.message ? err.message : err) + ').</div>'; }
  }
  function proItem(p){
    var em = appCtx.emailFor("pro", p.name);
    var areas = arr(p.consultation_options);
    var langs = arr(p.languages);
    var sp = (appCtx.specByPro[p.id] || []).join(", ");
    return '<div class="app-item"><details open><summary>⚖️ ' + esc(p.name) + ' — ' + esc(p.qualification || "professional") + '</summary>'
      + '<div class="app-meta">' + statusPill(p.verification_status) + ' ' + esc(p.location || "")
      + (p.experience_yrs ? " · " + esc(p.experience_yrs) + " yrs" : "")
      + ' · applied ' + esc(String(p.created_at || "").slice(0,10)) + (p.id ? ' · <code>' + esc(p.id) + '</code>' : '') + '</div>'
      + '<dl class="app-dl">'
      + (em ? '<dt>E-mail</dt><dd>' + esc(em) + ' <small>(from this application’s message copy — the professionals table stores no e-mail)</small></dd>' : '')
      + '<dt>Qualification</dt><dd>' + esc(p.qualification || "—") + '</dd>'
      + '<dt>Location</dt><dd>' + esc(p.location || "—") + '</dd>'
      + (sp ? '<dt>Specializations</dt><dd>' + esc(sp) + '</dd>' : '')
      + (areas ? '<dt>Areas handled</dt><dd>' + esc(areas) + '</dd>' : '')
      + (langs ? '<dt>Languages</dt><dd>' + esc(langs) + '</dd>' : '')
      + (p.availability ? '<dt>Availability</dt><dd>' + esc(p.availability) + '</dd>' : '')
      + (p.fee_note ? '<dt>Fee note</dt><dd>' + esc(p.fee_note) + '</dd>' : '')
      + (p.bio ? '<dt>Bio</dt><dd>' + esc(p.bio) + '</dd>' : '')
      + (p.photo_path ? '<dt>Photo file</dt><dd>' + esc(p.photo_path) + ' (filename recorded; original to be checked)</dd>' : '')
      + (p.verification_source ? '<dt>Record source</dt><dd>' + esc(p.verification_source) + '</dd>' : '')
      + (p.user_id ? '' : '<dt>Account link</dt><dd>not attached to a signed-in applicant — approval still publishes this listing, but no account role can be granted for it until an applicant account is linked.</dd>')
      + '</dl>'
      + '<div class="app-actions"><button class="btn btn-primary btn-sm" data-act="approve-pro" data-id="' + esc(p.id) + '">Approve (publish listing)</button>'
      + '<button class="btn btn-outline btn-sm" data-act="reject-pro" data-id="' + esc(p.id) + '">Reject (keep private)</button></div>'
      + '</details></div>';
  }
  function orgItem(o){
    var svc = arr(o.services);
    return '<div class="app-item"><details open><summary>🏛 ' + esc(o.name) + ' — ' + esc(o.specialization || "organisation") + '</summary>'
      + '<div class="app-meta">' + statusPill(o.verification_status) + ' ' + esc(o.location || "")
      + ' · applied ' + esc(String(o.created_at || "").slice(0,10)) + (o.id ? ' · <code>' + esc(o.id) + '</code>' : '') + '</div>'
      + '<dl class="app-dl"><dt>Contact</dt><dd>' + esc(o.email || "—") + ' · ' + esc(o.phone || "—") + '</dd>'
      + (o.website ? '<dt>Website</dt><dd>' + esc(o.website) + '</dd>' : '')
      + '<dt>Services</dt><dd>' + esc(svc || "—") + '</dd>'
      + (o.verification_source ? '<dt>Verification hints</dt><dd>' + esc(o.verification_source) + '</dd>' : '')
      + (o.source_note ? '<dt>Record source</dt><dd>' + esc(o.source_note) + '</dd>' : '')
      + (o.description ? '<dt>About</dt><dd>' + esc(o.description) + '</dd>' : '') + '</dl>'
      + '<div class="app-actions"><button class="btn btn-primary btn-sm" data-act="approve-org" data-id="' + esc(o.id) + '">Approve (verify listing)</button>'
      + '<button class="btn btn-outline btn-sm" data-act="reject-org" data-id="' + esc(o.id) + '">Reject (keep private)</button></div>'
      + '</details></div>';
  }
  function queueItem(m){
    var isApp = /^Application/.test(String(m.topic || ""));
    var ci = (appCtx.copyInfo && appCtx.copyInfo[m.id]) || null;
    /* The copy must never pose as the application record: say explicitly which
       of the two this is, and — only when NO record matches — offer to create
       the record from the applicant's own submitted copy (never an approval). */
    var recLine = "";
    if(isApp && ci){
      if(ci.matched){
        recLine = '<div class="app-meta">🗂 Application record: <strong>exists</strong> — Approve / Reject act on the card above; this copy stays read-only.</div>';
      } else if(ci.kind === "pro" || ci.kind === "org"){
        recLine = '<div class="app-meta">⚠ Application record: <strong>missing</strong> — no ' + (ci.kind === "pro" ? "professional" : "organization")
          + ' row matches this copy. The record is created automatically when the applicant first signs in after email confirmation; until that happens, create it here from the applicant\'s own submitted data (it will be stored as PENDING — never auto-approved): '
          + '<button class="btn btn-secondary btn-sm" data-act="create-record" data-id="' + esc(m.id) + '">Create application record from this copy</button></div>';
      } else {
        recLine = '<div class="app-meta">⚠ This copy could not be matched to an application kind — no record action is offered.</div>';
      }
    }
    return '<div class="app-item"><details><summary>📨 ' + esc(m.topic || "Application") + ' — ' + esc(m.name || "") + '</summary>'
      + '<div class="app-meta">from ' + esc(m.email || "?") + ' · ' + esc(String(m.created_at || m.at || "").slice(0,19).replace("T"," "))
      + ' · status ' + esc(m.status || "new") + '</div>'
      + (isApp ? '<div class="app-meta">✉ Message copy of a signup application — <strong>approval happens on the application records above, not on this message.</strong></div>' : '')
      + '<dl class="app-dl"><dt>Message</dt><dd>' + esc(m.message || "") + '</dd></dl>'
      + '<div class="app-actions"><a class="btn btn-outline btn-sm" href="mailto:' + esc(m.email || "") + '">Reply by email</a>'
      + '<button class="btn btn-secondary btn-sm" data-act="mark-read" data-id="' + esc(m.id) + '">Mark reviewed</button></div>'
      + '</details>' + recLine + '</div>';
  }

  /* Reject stores a distinct 'rejected' state (workflow: submitted → pending →
     verified | rejected). The value exists only after supabase/verification-states.sql
     is applied — until then the CHECK constraint refuses it, so fall back to
     'unverified' (still private) and tell the admin honestly. */
  async function rejectRow(table, id){
    try{
      await upd(table, { verification_status:"rejected", verified_at:null }, id);
      return null;
    }catch(err){
      if(/verification_status|check constraint|violates/i.test((err && err.message) || "")){
        await upd(table, { verification_status:"unverified", verified_at:null }, id);
        return "The distinct Rejected state is not available yet — the row was kept private as UNVERIFIED. Run supabase/verification-states.sql once (additive) to enable the Rejected state.";
      }
      throw err;
    }
  }

  /* Revoke lifecycle: approval (ra_approve_professional) verifies the row AND
     grants the 'professional' role together, so rejecting or reopening a
     previously approved professional must remove that role too — otherwise the
     account keeps a professional identity while the row says pending/rejected
     and role, status and access disagree.
     Primary path: ra_revoke_professional — one admin-only transaction that
     sets the state and deletes the role (supabase/verification-revoke.sql).
     Until that file is applied PostgREST cannot find the function, so fall
     back to the two halves this page's own admin policies allow (status
     update + role delete via the admin_roles policy) and honestly ask the
     administrator to apply the SQL. */
  async function revokeProfessional(id, state, rows){
    var r = await RA_SUPA.client.rpc("ra_revoke_professional", { p_id:id, p_state:state });
    if(!r.error) return null;
    var msg = r.error.message || "";
    var missing = r.error.code === "PGRST202" || r.error.code === "42883"
      || (msg.indexOf("ra_revoke_professional") > -1 && /does not exist|could not find/i.test(msg));
    if(!missing) throw r.error;
    var note = null;
    if(state === "rejected") note = await rejectRow("professionals", id);
    else await upd("professionals", { verification_status:"pending", verified_at:null }, id);
    var uid = (rows[id] || {}).user_id;
    if(uid){
      var d = await RA_SUPA.client.from("user_roles").delete().eq("user_id", uid).eq("role", "professional");
      if(d.error) throw d.error;
    } else {
      note = (note ? note + "\n\n" : "")
        + "This row's account link (user_id) was not loaded, so the professional role was NOT revoked on the account.";
    }
    return (note ? note + "\n\n" : "")
      + "supabase/verification-revoke.sql is not applied yet — the state change and the role revocation ran as two separate steps. Run that file once (additive) to make approval and revocation atomic.";
  }
  function decidedItem(d){
    var x = d.row;
    return '<div class="app-item"><details><summary>' + (d.kind === "pro" ? "⚖️ " : "🏛 ") + esc(x.name) + '</summary>'
      + '<div class="app-meta">' + statusPill(x.verification_status) + ' '
      + (d.kind === "pro" ? "professional" : "organisation")
      + ' · applied ' + esc(String(x.created_at || "").slice(0,10))
      + (x.verified_at ? ' · decided ' + esc(String(x.verified_at).slice(0,10)) : '')
      + (x.id ? ' · <code>' + esc(x.id) + '</code>' : '') + '</div>'
      + '<div class="app-actions"><button class="btn btn-outline btn-sm" data-act="reopen-' + d.kind + '" data-id="' + esc(x.id) + '">Reopen (back to pending)</button></div>'
      + '</details></div>';
  }

  /* Update a row by id with an honest outcome: PostgREST reports an RLS-blocked
     UPDATE as "success, 0 rows", so we select the touched rows back and fail
     loudly instead of pretending the decision was saved. */
  async function upd(table, values, id){
    var r = await RA_SUPA.client.from(table).update(values).eq("id", id).select("id");
    if(r.error) throw r.error;
    if(!r.data || !r.data.length) throw { message:"0 rows changed — row-level security blocked the update (apply supabase/applications-access.sql once, then reload)" };
  }

  /* ---- Application-record REPAIR from a message copy ----------------------
     Why this exists: signup can create the real professionals/organizations
     row only while a signed-in session exists. With email confirmation still
     pending, the direct insert is refused by RLS (by design), the flow stores
     the application as a contact-message copy, and the real record is attached
     later by js/auth.js flushPendingApplication when the applicant first
     signs in. If that has not happened, the record does not exist yet — and
     this dashboard must never pretend the copy IS the record. The
     administrator can materialise it here from the applicant's own submitted
     copy:
       · inserted through the EXISTING admin policies (edit_profs / edit_orgs)
         — no RLS change, no public write, no service-role key;
       · always stored as PENDING — never auto-approved; decisions still run
         only through the admin-only RPCs (ra_approve_* / ra_revoke_*);
       · never a duplicate: the applicant name is matched against every row
         this admin session can see before anything is inserted;
       · no account link is invented (this session cannot read auth.users or
         profiles) — the card states that honestly on the created record. */
  function splitList(s){ return String(s || "").split(";").map(function(x){ return x.trim(); }).filter(Boolean); }
  function blankish(v){
    v = String(v == null ? "" : v).trim();
    return (!v || /^(—|-|not stated|n\/a)$/i.test(v)) ? null : v;
  }
  async function createRecordFromCopy(m, ci){
    if(!m || !ci || ci.matched || (ci.kind !== "pro" && ci.kind !== "org")){
      return { ok:false, why:"This copy is already matched to an application record (or its kind could not be determined), so nothing was created." };
    }
    var txt = String(m.message || "");
    function get(re){ var r = re.exec(txt); return r ? String(r[2]).trim() : ""; }
    try{
      if(ci.kind === "pro"){
        var bio = (/(^|\n)Bio:\s*([\s\S]*?)(?=\n(?:Credential file recorded:|Photo recorded:|Registration file recorded:|Logo recorded:)|\nStatus:|$)/.exec(txt) || [])[2] || "";
        var row = {
          id: "prof-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,6),
          name: ci.name || get(/(^|\n)Name:\s*(.+)/),
          qualification: blankish(get(/(^|\n)Qualification:\s*(.+)/)),
          experience_yrs: blankish(get(/(^|\n)Years:\s*(.+)/)),
          location: blankish(get(/(^|\n)Location:\s*(.+)/)),
          languages: splitList(get(/(^|\n)Languages:\s*(.+)/)),
          bio: blankish(bio),
          consultation_options: splitList(get(/(^|\n)Areas:\s*(.+)/)),
          fee_note: blankish(get(/(^|\n)Fee note:\s*(.+)/)),
          availability: blankish(get(/(^|\n)Availability:\s*(.+)/)),
          verification_status: "pending",
          is_demo: false,
          verification_source: "Created by an administrator from this application's signup message copy (no application record existed)."
          /* user_id intentionally NOT set — no account link is guessed. */
        };
        if(!row.name) return { ok:false, why:"No Name line could be parsed from this copy — nothing was created." };
        var r = await RA_SUPA.client.from("professionals").insert(row);
        if(r.error && r.error.code === "23505"){
          row.id = "prof-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,6);
          r = await RA_SUPA.client.from("professionals").insert(row);
        }
        if(r.error) return { ok:false, why: r.error.message || "permission refused" };
        return { ok:true, kind:"pro", name: row.name };
      }
      var about = (/(^|\n)About:\s*([\s\S]*?)(?=\n(?:Registration file recorded:|Logo recorded:)|\nStatus:|$)/.exec(txt) || [])[2] || "";
      var contact = get(/(^|\n)Contact:\s*(.+)/);
      var type = /\((.+)\)/.exec(contact);
      var orow = {
        id: "org-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,6),
        name: ci.name || get(/(^|\n)Organisation:\s*(.+)/),
        description: blankish(about),
        services: splitList(get(/(^|\n)Services:\s*(.+)/)),
        specialization: type ? String(type[1]).trim() : null,
        location: blankish(get(/(^|\n)State:\s*(.+)/)),
        address: blankish(get(/(^|\n)Address:\s*(.+)/)),
        phone: blankish(get(/(^|\n)Phone:\s*(.+)/)),
        email: blankish(get(/(^|\n)Email:\s*(\S+@\S+)/)),
        website: blankish(get(/(^|\n)Website:\s*(.+)/)),
        verification_source: blankish(get(/(^|\n)Verification hints:\s*(.+)/)),
        source_note: "Created by an administrator from this application's signup message copy (no application record existed).",
        verification_status: "pending"
      };
      if(!orow.name) return { ok:false, why:"No Organisation line could be parsed from this copy — nothing was created." };
      var r2 = await RA_SUPA.client.from("organizations").insert(orow);
      if(r2.error && r2.error.code === "23505"){
        orow.id = "org-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,6);
        r2 = await RA_SUPA.client.from("organizations").insert(orow);
      }
      if(r2.error) return { ok:false, why: r2.error.message || "permission refused" };
      return { ok:true, kind:"org", name: orow.name };
    }catch(err){ return { ok:false, why: String(err && err.message ? err.message : err) }; }
  }

  async function loadApplications(){
    var box = document.getElementById("appsBox");
    if(!box) return;
    var out = "", any = false;
    /* Full professional rows keyed by id. The revoke fallback (SQL add-on not
       applied yet) needs the row's user_id to remove the role from the
       account; org rows never have user_id and are skipped naturally. */
    var appRows = {};
    /* Per-section read failures / precise empty-state explanations — surfaced
       in the UI instead of being swallowed by a silent catch. */
    var notes = [];
    function stash(rows){
      (rows || []).forEach(function(x){ if(x && x.id && x.user_id) appRows[x.id] = x; });
    }

    /* ---- application MESSAGE copies first (read-status only). They also
       carry the applicant e-mail: the professionals table has no e-mail
       column and profiles are not admin-readable via RLS, so the message
       copy is the only stored source — matched by name + application kind. */
    var queue = [];
    try{
      var q = await RA_SUPA.client.from("contact_messages").select("*")
        .like("topic", "Application%")
        .order("created_at", { ascending:false }).limit(30);
      if(q.error) throw q.error;
      queue = q.data || [];
    }catch(err){
      notes.push("⚠ Application message copies could not be read: " + esc(err && err.message ? err.message : err));
    }
    var emailByName = {};
    queue.forEach(function(m){
      var txt = String(m.message || "");
      var nm = /(^|\n)Name:\s*(.+)/.exec(txt);
      var em = /(^|\n)Email:\s*(\S+@\S+)/.exec(txt);
      if(!nm || !em) return;
      var kind = /PROFESSIONAL APPLICATION/i.test(txt) ? "pro"
               : /ORGANISATION APPLICATION/i.test(txt) ? "org" : "any";
      var key = String(nm[2]).trim().toLowerCase();
      if(!emailByName[key + "|" + kind]) emailByName[key + "|" + kind] = em[2];
      if(!emailByName[key + "|any"]) emailByName[key + "|any"] = em[2];
    });

    /* ---- professional records: read EVERY row this admin session can see
       (NO status filter — partition below) and split client-side, so no
       stored value, including NULL or an unexpected one, can hide an
       application from this dashboard. Decisions still run through the
       admin-only RPCs (ra_approve_professional / ra_revoke_professional). */
    var pros = [];
    try{
      var p = await RA_SUPA.client.from("professionals").select("*")
        .order("created_at", { ascending:false }).limit(50);
      if(p.error) throw p.error;
      pros = p.data || [];
    }catch(err){
      notes.push("⚠ Professional applications could not be read: " + esc(err && err.message ? err.message : err));
    }
    stash(pros);
    var proPending = [], proDecided = [];
    pros.forEach(function(x){
      (x.verification_status === "verified" || x.verification_status === "rejected" ? proDecided : proPending).push(x);
    });

    /* specialisations (public-read table) for the pending cards */
    var specByPro = {};
    if(proPending.length){
      try{
        var s = await RA_SUPA.client.from("professional_specializations").select("professional_id,specialization")
          .in("professional_id", proPending.map(function(x){ return x.id; }));
        if(!s.error && s.data){
          s.data.forEach(function(r){
            if(!r.professional_id) return;
            (specByPro[r.professional_id] = specByPro[r.professional_id] || []).push(r.specialization);
          });
        }
      }catch(_){}
    }
    appCtx = {
      specByPro: specByPro,
      emailFor: function(kind, name){
        var key = String(name || "").trim().toLowerCase();
        return emailByName[key + "|" + kind] || emailByName[key + "|any"] || "";
      }
    };

    /* ---- organisations: same unfiltered read + client-side split ---- */
    var orgs = [];
    try{
      var o = await RA_SUPA.client.from("organizations").select("*")
        .order("created_at", { ascending:false }).limit(50);
      if(o.error) throw o.error;
      orgs = o.data || [];
    }catch(err){
      notes.push("⚠ Organisation applications could not be read: " + esc(err && err.message ? err.message : err));
    }
    var orgPending = [], orgDecided = [];
    orgs.forEach(function(x){
      (x.verification_status === "verified" || x.verification_status === "rejected" ? orgDecided : orgPending).push(x);
    });

    /* ---- copy ↔ record matching: each application message copy is checked
       against EVERY application row this admin session can see (name match,
       case-insensitive; the professionals table stores no e-mail column), so
       the dashboard states per copy whether its record exists — and never
       silently lets a copy stand in for a missing record. ---- */
    var proNames = {}, orgNames = {};
    pros.forEach(function(x){ if(x && x.name) proNames[String(x.name).trim().toLowerCase()] = true; });
    orgs.forEach(function(x){ if(x && x.name) orgNames[String(x.name).trim().toLowerCase()] = true; });
    appCtx.copyInfo = {};
    queue.forEach(function(m){
      var txt = String(m.message || "");
      var isOrg = /ORGANISATION APPLICATION/i.test(txt);
      var isPro = /PROFESSIONAL APPLICATION/i.test(txt);
      if(!isOrg && !isPro){ appCtx.copyInfo[m.id] = { kind:"unknown", matched:false }; return; }
      var nm = (isOrg ? /(^|\n)Organisation:\s*(.+)/.exec(txt) : /(^|\n)Name:\s*(.+)/.exec(txt));
      var name = nm ? String(nm[2]).trim() : "";
      var set = isOrg ? orgNames : proNames;
      appCtx.copyInfo[m.id] = { kind: isOrg ? "org" : "pro", name: name, matched: !!(name && set[name.toLowerCase()]) };
    });

    /* ---- render: DECISION RECORDS FIRST, message copies LAST ---- */
    if(proPending.length){
      any = true;
      out += '<div class="section-head"><h3>⚖️ Legal Professional applications — Approve / Reject</h3></div>'
        + proPending.map(function(x){ return safe(proItem, x, "professional"); }).join("");
    }
    if(orgPending.length){
      any = true;
      out += '<div class="section-head"><h3>🏛 Organization applications — Approve / Reject</h3></div>'
        + orgPending.map(function(x){ return safe(orgItem, x, "organisation"); }).join("");
    }
    var decided = proDecided.map(function(x){ return { row:x, kind:"pro" }; })
      .concat(orgDecided.map(function(x){ return { row:x, kind:"org" }; }));
    decided.sort(function(a,b){ return String(b.row.created_at || "").localeCompare(String(a.row.created_at || "")); });
    if(decided.length){
      any = true;
      out += '<div class="section-head"><h3>🗂 Recently decided — Verified / Rejected (Reopen here)</h3></div>'
        + decided.map(function(d){ return safe(decidedItem, d, d.kind === "pro" ? "professional" : "organisation"); }).join("");
    }
    if(queue.length){
      any = true;
      out += '<div class="section-head"><h3>📨 Contact-message copies — read only, no approval here</h3></div>'
        + queue.map(function(m){ return safe(queueItem, m, "message"); }).join("");
    }

    /* Honest empty state: say exactly what the database returned — never
       pretend rows exist, never hide a read failure in a silent catch. */
    if(!notes.length){
      var appMsgs = queue.length;
      if(!pros.length && !orgs.length){
        notes.push("The database returned no professional or organisation application rows for this admin session."
          + (appMsgs ? " " + appMsgs + " application message cop" + (appMsgs === 1 ? "y exists" : "ies exist")
            + ", but a message copy is not an application record: no application record has been created yet. A record is created automatically when the applicant confirms their email and signs in for the first time — or create it right now with <strong>Create application record</strong> on any copy below. Only if application rows really do exist in the database would the admin read policies be missing instead — run supabase/applications-access.sql once (sections 1–2), then reload." : ""));
      } else if(!pros.length && appMsgs){
        notes.push("Application message copies exist, but no professional rows are visible to this admin session. A record is created when the applicant confirms their email and signs in — or create it directly from a copy below. If rows are present in the database, run supabase/applications-access.sql once (sections 1–2), then reload.");
      }
    }

    box.innerHTML = (any ? out : '<p class="empty">No applications are awaiting review right now.</p>')
      + notes.map(function(n){ return '<p class="empty">' + n + '</p>'; }).join("");
    box.querySelectorAll("button[data-act]").forEach(function(b){
      b.addEventListener("click", async function(){
        b.disabled = true;
        var id = b.dataset.id, act = b.dataset.act;
        try{
          if(act === "approve-pro"){
            var r = await RA_SUPA.client.rpc("ra_approve_professional", { p_id:id });
            if(r.error) throw r.error;
          } else if(act === "reject-pro"){
            var note = await revokeProfessional(id, "rejected", appRows);
            if(note) alert("Decision saved.\n\nNote: " + note);
          } else if(act === "approve-org"){
            var ro = await RA_SUPA.client.rpc("ra_approve_organization", { p_id:id });
            if(ro.error){
              var mro = ro.error.message || "";
              var missRo = ro.error.code === "PGRST202" || ro.error.code === "42883"
                || (mro.indexOf("ra_approve_organization") > -1 && /does not exist|could not find/i.test(mro));
              if(!missRo) throw ro.error;
              await upd("organizations", { verification_status:"verified", verified_at:new Date().toISOString() }, id);
              alert("Decision saved.\n\nNote: ra_approve_organization is not available in the database yet — run supabase/applications-access.sql once (section 4) to switch organisation approval to the secure RPC path.");
            }
          } else if(act === "reject-org"){
            var note2 = await rejectRow("organizations", id);
            if(note2) alert("Decision saved.\n\nNote: " + note2);
          } else if(act === "reopen-pro"){
            var note3 = await revokeProfessional(id, "pending", appRows);
            if(note3) alert("Decision saved.\n\nNote: " + note3);
          } else if(act === "reopen-org"){
            await upd("organizations", { verification_status:"pending", verified_at:null }, id);
          } else if(act === "create-record"){
            var mc = null; queue.forEach(function(x){ if(x.id === id) mc = x; });
            var made = await createRecordFromCopy(mc, appCtx.copyInfo[id]);
            if(!made.ok){
              alert("Could not create the application record:\n\n" + made.why
                + "\n\nNothing was written — no partial or duplicate record exists.");
              b.disabled = false;
              return;
            }
          } else if(act === "mark-read"){
            await upd("contact_messages", { status:"read" }, id);
          }
          loadApplications();
        }catch(err){
          b.disabled = false;
          alert("Could not save the decision: " + (err && err.message ? err.message : err)
            + "\n\nIf this mentions permissions or policy, apply supabase/applications-access.sql once, then retry.");
        }
      });
    });
  }

  async function loadMessages(){
    var box = document.getElementById("msgsBox");
    if(!box) return;
    try{
      var r = await RA_SUPA.client.from("contact_messages").select("*")
        .not("topic", "like", "Application%")
        .order("created_at", { ascending:false }).limit(50);
      if(r.error) throw r.error;
      var rows = (r.data || []).filter(function(m){ return !/^Application/i.test(m.topic || ""); });
      box.innerHTML = rows.length ? rows.map(queueItem).join("") : '<p class="empty">Inbox is empty.</p>';
      box.querySelectorAll("button[data-act]").forEach(function(b){
        b.addEventListener("click", async function(){
          b.disabled = true;
          try{ await upd("contact_messages", { status:"read" }, b.dataset.id); }
          catch(err){ b.disabled = false; alert("Could not update: " + (err && err.message ? err.message : err)); return; }
          loadMessages();
        });
      });
    }catch(err){
      box.innerHTML = '<p class="empty">⚠ Could not load messages: ' + esc(err && err.message ? err.message : err) + '</p>';
    }
  }

  /* ==================== boot ==================== */
  whenReady(function(connected){
    if(!connected){ renderLocked(); return; }
    line.textContent = "Signed in — checking your role…";
    RA_AUTH.fetchRole().then(function(role){
      var u = RA_AUTH.current() || {};
      if(!u.email){ renderSignedOut(); return; }
      if(role !== "admin"){ renderDenied(role); return; }
      renderAdmin(u);
    }).catch(function(){ renderDenied("role check failed"); });
  });
})();
</script>
</body>
</html>
